name: Temporary docs reconciliation

on:
  push:
    branches:
      - docs/p3-3-closeout-roadmap
    paths:
      - .github/workflows/docs-p3-3-closeout-temp.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p3-3-closeout-roadmap
          fetch-depth: 0

      - name: Apply targeted documentation replacements
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing replacement target: {label}")
              return text.replace(old, new, 1)

          status_path = Path("PROJECT_STATUS.md")
          status = status_path.read_text()

          old_top = '''| Última revisión integral | 2026-08-21 — **America/Bogota** |
          | Rama verificada | `main` al iniciar este checkpoint; consultar HEAD live al retomar |
          | Runtime production baseline verificado | `d4e3a28140664b96fc5d74578cef0442baa1a191` — P3.2 merge con smoke público/Admin/Safeguards aprobado |
          | Trabajo activo | **P3.3 — Mobile critical rendering path** |
          | Producción | `https://sdlive.show` |
          | Media pública | `https://media.sdlive.show` |
          | Milestone actual | P3 — integridad pública, conversión, SEO y performance basados en evidencia |
          | Estado | **P3.0 audit CERRADO; P3.1 y P3.2 CERRADOS y smokeados; P3.3 promovido a F** |
          | Active Gate | **F — P3.3 Mobile critical rendering path** |
          | Gate posterior | **P3.4 candidate — responsive image/media delivery pipeline; no mezclar por defecto con P3.3** |'''
          new_top = '''| Última revisión integral | 2026-08-22 — **America/Bogota** |
          | Rama verificada | `main` al iniciar este checkpoint; consultar HEAD live al retomar |
          | Runtime production baseline verificado | `49d09a8598d0a4c3c42de7b1dedacf763a26a91b` — P3.3 accepted runtime after PR #46/#47 production measurement |
          | Trabajo activo | **P3.4 — Responsive image/media delivery pipeline** |
          | Producción | `https://sdlive.show` |
          | Media pública | `https://media.sdlive.show` |
          | Milestone actual | P3 — integridad pública, conversión, SEO y performance basados en evidencia |
          | Estado | **P3.0–P3.3 CERRADOS; P3.4 promovido a F** |
          | Active Gate | **F — P3.4 Responsive image/media delivery pipeline** |
          | Gate posterior | **Availability-Aware Contact Widget — Medium-High backlog after current active gate; then general backlog unless reprioritized** |'''
          status = replace_once(status, old_top, new_top, "status header")

          status = replace_once(
              status,
              '- Public content CMS usa **Published**, nunca Draft.\n',
              '- Public content CMS usa **Published**, nunca Draft.\n- **CMS first-paint anti-popping:** Published SSR must not visibly paint stale static CMS copy and then replace it. `cms-hydration.js` remains a resilience fallback for non-SSR/static/Admin paths; performance work may skip redundant hydration only when SSR is already authoritative, and must never blank the document merely to hide transitions.\n',
              "anti-popping invariant",
          )

          status = replace_once(
              status,
              '| Mobile lab performance | weak under throttled Lighthouse; Desktop strong | **F — P3.3 / P1-HIGH** | Mobile 61/66, Desktop 96; LCP Hero h1; TTFB ~10 ms |\n| Responsive image delivery | ~1.4 MB estimated savings in audit | P1-HIGH / P3.4 candidate | PageSpeed image opportunities; needs variants/`srcset` pipeline |',
              '| Mobile lab performance | P3.3 closed with material lab improvement; field CWV still lacks sufficient CrUX | A — P3.3 cerrado | baseline Mobile 61/66 with LCP 14.8/10.2 s; final post-#47 runs 75/73 with LCP 5.4/6.0 s; TTFB ~10 ms |\n| Responsive image delivery | ~1.4 MB estimated savings repeated in audit | **F — P3.4 / P1-HIGH** | variants/`srcset`/`sizes` pipeline; preserve masters and current R2/static ownership |\n| Availability-Aware Contact Widget | Proposed; no runtime/schema yet | D — Medium-High backlog after active gate | `docs/roadmap/availability-aware-contact-widget.md`; future D1 `availability_state`, exact owner WhatsApp gate, existing `leads` table |',
              "evidence matrix performance",
          )

          p33_pattern = re.compile(r'## P3\.3 — Mobile critical rendering path\n.*?\n---\n\n# Backlog maestro por área', re.S)
          p33_replacement = '''## P3.3 — Mobile critical rendering path

**Estado: CERRADO y VALIDADO CON PRODUCCIÓN + LAB el 2026-08-22.**

Objetivo cumplido: retirar trabajo redundante demostrado en el first paint/LCP móvil sin degradar privacidad, idioma SSR, CMS Published first paint ni contratos visuales.

- [x] Baseline P3.0: Mobile 61/66; LCP 14.8/10.2 s; Hero `<h1>` como LCP; TTFB ~10 ms.
- [x] PR #44 probó defer de CSS secundarios; dos corridas no mostraron beneficio atribuible y se revirtió en PR #45. No acumular optimizaciones sin evidencia.
- [x] PR #46 (`d52ca8d80c4e9fd3caa5f6be1aaae423e00c0840`) evita importar `hero-content.js` → `cms-hydration.js` cuando `data-server-rendered="true"`; static/non-edge/Admin conservan el fallback.
- [x] Motivo histórico preservado: `cms-hydration.js` existe para evitar static→CMS flash/popping. No borrarlo; en SSR solo se evita la hidratación redundante.
- [x] Smoke después de PR #46: no CMS content popping; cadena redundante desapareció del dependency tree.
- [x] PR #47 (`49d09a8598d0a4c3c42de7b1dedacf763a26a91b`) mantiene un bootstrap síncrono mínimo de Consent Mode `default: denied` antes de GTM y difiere el gestor/UI completo de consentimiento en `/` público.
- [x] Smoke PR #47: fresh private banner presente; `Necessary only` persiste tras reload; no CMS content popping.
- [x] `analytics-consent.js` dejó de aparecer entre Render-blocking requests del Home público medido.
- [x] Final post-#47 Mobile PageSpeed: **75 / LCP 5.4 s** y **73 / LCP 6.0 s**; FCP 2.7 s en ambas; Hero element render delay ~810/670 ms.
- [x] No se cambió `Cache-Control: no-store`; TTFB bajo no lo identifica como cuello principal demostrado.
- [x] Hallazgo separado: refresh con `#rental` puede competir `scrollIntoView()` con history restoration y producir top → Rental → posición previa. No es CMS popping; queda polish futuro y no debe resolverse ocultando el documento ni forzando scroll restoration global.

## P3.4 — Responsive image/media delivery pipeline

**Estado: F — ACTIVE GATE / APPROVED WORK.**

Objetivo: atacar la oportunidad Mobile repetida de ~1.4 MB mediante un pipeline de entrega responsive, sin degradar masters, CMS/R2 source-of-truth, branding ni fallbacks.

Change Safety / acceptance antes de implementar:

- [ ] Inventariar cuáles assets concretos explican el ahorro: R2 CMS media vs logos/header/static code-owned.
- [ ] Preservar master/original; no comprimir ni reemplazar manualmente assets uno por uno.
- [ ] Definir variantes y `srcset`/`sizes` basados en dimensiones reales de render, no en nombres arbitrarios.
- [ ] Mantener R2 como source-of-truth binario de media administrable y GitHub para branding/fallbacks code-owned.
- [ ] No introducir Cloudflare Images/servicio pago sin evidencia de necesidad/coste y aprobación.
- [ ] Mantener alt/ARIA existentes y no alterar contenido CMS/Draft/Published.
- [ ] Evitar layout shift: width/height/aspect-ratio deben seguir definidos.
- [ ] Medir PageSpeed Mobile antes/después con al menos dos corridas comparables; revisar bytes y LCP/FCP además del score.
- [ ] Smoke visual Desktop/Mobile, EN/ES, COL/INT, Editor/Media Library, Safeguards y fallbacks relevantes.
- [ ] PR + CI + rollback estrecho.

---

# Backlog maestro por área'''
          status, count = p33_pattern.subn(p33_replacement, status, count=1)
          if count != 1:
              raise SystemExit("missing P3.3 section block")

          status = replace_once(
              status,
              '- [ ] Contact: rate limiting explícito; confirmation email al visitante solo si se diseña/aprueba.\n',
              '- [ ] Contact: rate limiting explícito; confirmation email al visitante solo si se diseña/aprueba.\n- [ ] **Hash/scroll restoration polish:** con `#rental` retenido, refresh puede mostrar top → Rental → posición restaurada por carrera entre `scrollIntoView()` y history restoration. Corregir sin blanking, sin `scrollRestoration=manual` global a ciegas y sin regresión de LCP.\n',
              "scroll restoration backlog",
          )

          status = replace_once(
              status,
              '## AI / media processing integrations\n\n',
              '## AI / media processing integrations\n\n- [ ] **Availability-Aware Contact Widget — D / Medium-High backlog after active gate:** single server-side availability resolver using D1 `availability_state`: expiring manual override → travel mode → default weekly schedule in `America/Bogota`. Owner WhatsApp commands (`away`, `back`, `status`) require exact `env.OWNER_WHATSAPP_NUMBER` before customer/AI routing. When unavailable, a future AI widget may qualify leads only; it cannot own/invent pricing/catalog and must write into the existing `leads` table. Full spec: `docs/roadmap/availability-aware-contact-widget.md`.\n',
              "availability backlog",
          )

          status = replace_once(
              status,
              '- [ ] Responsive image/media pipeline: variantes y `srcset`/`sizes` para R2/media + optimización independiente de header static logos; preservar master/original y no resolver asset-by-asset. **P3.4 candidate, no activo mientras P3.3 esté abierto.**\n- [ ] **F — P3.3 Mobile critical rendering path:** reducir blocking cost de CSS/fonts/scripts preservando consent default-denied, language first-paint, Hero SSR y Visual Safeguards; medir antes/después.\n',
              '- [ ] **F — P3.4 Responsive image/media delivery pipeline:** variantes y `srcset`/`sizes` para R2/media + optimización separada de header/static assets; preservar master/original y no resolver asset-by-asset.\n- [x] **P3.3 Mobile critical rendering path:** cerrado 2026-08-22; PR #46/#47 aceptados por medición, anti-popping preservado y render blocking reducido.\n',
              "platform active gate",
          )

          status = status.replace(
              '**P3.1 Consent parity y P3.2 public staging strip cerrados y smokeados**.',
              '**P3.1 Consent parity, P3.2 public staging strip y P3.3 critical rendering cerrados y smokeados/evidenciados**.',
          )
          status = status.replace(
              'Insights/Journal sin sistema editorial real, mobile critical render todavía por optimizar.',
              'Insights/Journal sin sistema editorial real.',
          )
          status = status.replace(
              'Home edge-cache optimization y Crawler Hints/IndexNow.',
              'Home edge-cache optimization, Crawler Hints/IndexNow, Availability-Aware Contact Widget y hash/scroll-restoration polish.',
          )
          status = status.replace(
              '- **F — Active Gate:** **P3.3 Mobile critical rendering path.** Reducir blocking/render delay sin degradar consent, idioma first-paint, SSR ni Safeguards.',
              '- **F — Active Gate:** **P3.4 Responsive image/media delivery pipeline.** Reducir bytes/imágenes responsive sin degradar masters, CMS/R2 ownership, layout ni branding.',
          )

          status = replace_once(
              status,
              '| Mobile critical rendering | lab Mobile 61/66; Desktop 96; Hero h1 LCP; TTFB ~10ms | reducir blocking/render delay con medición y guardrails | **F — P3.3** | P1-HIGH | M | alto | medio | PageSpeed audit + first-paint contracts |\n| Responsive image delivery | ~1.4 MB estimated savings | variants/`srcset`/`sizes` pipeline; preservar masters | P3.4 candidate | P1-HIGH | M/L | alto | medio | PageSpeed audit + R2/static asset architecture |',
              '| Mobile critical rendering | P3.3 cerrado; final lab 75/73, LCP 5.4/6.0 s | conservar accepted changes + anti-popping/privacy invariants | **A — P3.3 closed** | closed | — | alto | bajo | PR #46/#47 + production smoke + PageSpeed |\n| Responsive image delivery | ~1.4 MB estimated savings repetido | variants/`srcset`/`sizes` pipeline; preservar masters | **F — P3.4** | P1-HIGH | M/L | alto | medio | PageSpeed audit + R2/static asset architecture |\n| Availability-aware contact | no existe runtime/schema todavía | D1 availability state + owner commands + WhatsApp/AI surface switching | **D — Medium-High after active gate** | next backlog | L | alto conversión | alto | exact owner auth + existing `leads` + provider/webhook validation |',
              "gap analysis performance",
          )

          status = replace_once(
              status,
              '9. **Responsive image/media delivery + mobile critical rendering.** P3.3 toma primero critical rendering; variants/pipeline queda separado como siguiente candidate.\n',
              '9. **Responsive image/media delivery.** P3.4 es el gate activo tras cerrar P3.3; variants/`srcset`/`sizes` deben preservar masters y ownership.\n10. **Availability-Aware Contact Widget.** Medium-High inmediatamente después del active gate salvo repriorización explícita; D1 availability source-of-truth, owner WhatsApp hard gate y existing `leads` table.\n',
              "future integrations priority",
          )

          status = replace_once(
              status,
              '- GitHub = source-of-truth de código; D1 = contenido estructurado; R2 = media administrable.\n',
              '- GitHub = source-of-truth de código; D1 = contenido estructurado; R2 = media administrable.\n- **CMS anti-popping:** no sacrificar first-paint correctness por métricas; SSR puede evitar hidratación redundante, pero `cms-hydration.js`/fallback no se elimina sin reemplazo probado.\n- **Availability futura:** si se implementa, D1 `availability_state` será la única fuente de verdad; chatbot/proveedor no puede poseer disponibilidad, pricing, catálogo ni leads.\n',
              "final invariants",
          )

          milestone_anchor = '''## 2026-08-21 — P3.2 public Home staging strip

          **CERRADO.** PR #42 squash-merged en `d4e3a28140664b96fc5d74578cef0442baa1a191`; CI verde. View Source público no contiene `Future picture project` ni `contentStaging`; Admin Editor permanece normal y Safeguards continúa 9/9. Static/Admin staging se conservó y Sound for Picture no fue publicado.

          ---'''
          milestone_new = '''## 2026-08-21 — P3.2 public Home staging strip

          **CERRADO.** PR #42 squash-merged en `d4e3a28140664b96fc5d74578cef0442baa1a191`; CI verde. View Source público no contiene `Future picture project` ni `contentStaging`; Admin Editor permanece normal y Safeguards continúa 9/9. Static/Admin staging se conservó y Sound for Picture no fue publicado.

          ## 2026-08-22 — P3.3 Mobile critical rendering path

          **CERRADO.** El experimento CSS #44 se revirtió en #45 por falta de beneficio medible. PR #46 (`d52ca8d8...`) eliminó la descarga redundante `hero-content.js`→`cms-hydration.js` solo cuando SSR ya era authoritative, conservando el fallback anti-popping. PR #47 (`49d09a85...`) separó el Consent Mode default-denied síncrono del gestor/UI diferido en Home. Smoke confirmó banner/persistencia y ausencia de CMS popping. Dos corridas finales Mobile: 75/LCP 5.4 s y 73/LCP 6.0 s.

          ## 2026-08-22 — Availability-Aware Contact roadmap checkpoint

          **BACKLOG D / Medium-High.** Se preservó `docs/roadmap/availability-aware-contact-widget.md`. Debe ir después del active gate y por encima del backlog general CRM/Calendar/quote automation salvo repriorización. No existe todavía D1 schema/API/webhook/widget; no tratar como implementado.

          ---'''
          status = replace_once(status, milestone_anchor, milestone_new, "milestone closeout")

          tail_pattern = re.compile(r'# Siguiente trabajo\n.*\Z', re.S)
          tail = '''# Siguiente trabajo

**P3.4 está activo.** Orden de ejecución:

1. inventariar assets que explican el ~1.4 MB estimado: media R2/CMS vs branding/header/static;
2. medir dimensiones reales de render y consumidores antes de definir variantes;
3. diseñar el mínimo pipeline de variants + `srcset`/`sizes` preservando masters/originales y fallbacks;
4. mantener R2 como owner de media CMS y GitHub como owner de branding/static critical assets;
5. no activar Cloudflare Images ni producto pago sin evidencia/approval;
6. añadir tests de resolución/markup/dimensiones y evitar CLS;
7. PR + CI + smoke Desktop/Mobile, EN/ES, COL/INT, Editor/Media Library/Safeguards;
8. repetir PageSpeed Mobile al menos dos veces y comparar bytes/FCP/LCP además del score;
9. después del cierre de P3.4, el **Availability-Aware Contact Widget** queda como backlog Medium-High siguiente por encima de CRM/Calendar/quote automation, salvo repriorización explícita;
10. mantener el recheck de Bing para 2026-08-28 a 2026-09-04 sin re-submissions repetidos mientras tanto.

**Sound for Picture permanece inert staging en static/Admin source hasta contenido/scope real aprobado; no forma parte del response público Home desde P3.2.**
'''
          status, count = tail_pattern.subn(tail, status, count=1)
          if count != 1:
              raise SystemExit("missing Siguiente trabajo tail")

          status_path.write_text(status)

          roadmap_path = Path("ROADMAP_MASTER_CHECKLIST.md")
          roadmap = roadmap_path.read_text()
          roadmap = roadmap.replace('Last reconciliation: **2026-08-21 — America/Bogota**', 'Last reconciliation: **2026-08-22 — America/Bogota**', 1)
          roadmap = roadmap.replace(
              'Runtime production baseline checked against: `4a8c425bc016acad78ef15d07dd8a7a4792bbc73`; P2.8 Home media closeout is production-smoked and closed. P3.0 public/SEO/performance audit is now closed as an evidence checkpoint.',
              'Runtime production baseline checked against: `49d09a8598d0a4c3c42de7b1dedacf763a26a91b`; P2.8 and P3.0–P3.3 closeouts are production-smoked/evidenced. P3.4 is the active responsive-image gate.',
              1,
          )
          current_gate_pattern = re.compile(r'## Current Active Gate\n\n.*?\n\n---', re.S)
          current_gate = '''## Current Active Gate

🚧 **F — P3.4 Responsive image/media delivery pipeline.** P3.0 audit, P3.1 Consent Mode parity, P3.2 public staging strip and P3.3 Mobile critical rendering path are closed. P3.4 targets the repeated ~1.4 MB Mobile image-delivery opportunity with variants/`srcset`/`sizes`, preserving original/master media, R2/GitHub ownership, layout stability and current Editor/fallback behavior.

**Next Medium-High backlog after this gate:** Availability-Aware Contact Widget (`docs/roadmap/availability-aware-contact-widget.md`), above general CRM/calendar/quote-automation backlog unless explicitly reprioritized. Its presence here does not authorize implementation during P3.4.

---'''
          roadmap, count = current_gate_pattern.subn(current_gate, roadmap, count=1)
          if count != 1:
              raise SystemExit("missing roadmap current gate")

          roadmap = roadmap.replace(
              '- ⏳ **Responsive delivery pipeline:** P3.0 Lighthouse found roughly 1.4 MB image-delivery savings on Mobile. Generate appropriate variants (for example small/medium/large widths as evidence supports), use `srcset`/`sizes`, and preserve original/master media; do not optimize manually image-by-image.',
              '- 🚧 **P3.4 Active Gate — Responsive delivery pipeline:** P3.0/P3.3 Lighthouse evidence repeatedly shows roughly 1.4 MB image-delivery savings on Mobile. Generate evidence-based variants, use `srcset`/`sizes`, preserve original/master media and current R2/static ownership; do not optimize manually image-by-image.',
              1,
          )
          roadmap = roadmap.replace(
              '- 🚧 **P3.1:** ensure every public page that loads GTM establishes the same Consent Mode/default-denied contract before GTM; this is analytics/privacy shell work, not Contact submission logic.',
              '- ✅ **P3.1 closed:** every current public page that loads GTM establishes the Consent Mode/default-denied contract before GTM; Home P3.3 later kept the denied bootstrap synchronous while deferring only the full consent UI.',
              1,
          )

          insert_anchor = '## 14. Basic CRM\n'
          availability_block = '''## 13.5 Availability-Aware Contact Widget

**Status: ⏳ D — Medium-High backlog; sequence immediately after the current active gate and above general CRM/calendar/quote automation unless reprioritized.**

- ⏳ One D1 `availability_state` source of truth; no browser/chatbot-owned availability state.
- ⏳ Resolution priority: expiring manual override → travel mode/timezone+end date → default weekly schedule in `America/Bogota`.
- ⏳ Owner WhatsApp commands such as `away 2h`, `away 4h`, `away tomorrow`, `back`, `status` require an exact sender match against `env.OWNER_WHATSAPP_NUMBER` before any AI/customer routing.
- ⏳ `GET /api/availability` returns only the availability result needed by the frontend and should use a bounded short cache TTL.
- ⏳ Frontend swaps existing WhatsApp bubble vs future AI lead-qualification surface from the server result.
- ⏳ AI scope is qualification only; no pricing/catalog/preset authority and no invented quotes.
- ⏳ AI-captured leads must land in the existing `leads` table; no parallel third-party lead store.
- ⏳ Manual/travel states self-expire; stale overrides must fall through safely.
- ⏳ Before implementation verify real WhatsApp provider/webhook architecture, signatures/auth, credentials, D1 migration, cache freshness and AI-provider privacy/retention.

Full proposed data model/API/guardrails/acceptance criteria: `docs/roadmap/availability-aware-contact-widget.md`.

'''
          roadmap = replace_once(roadmap, insert_anchor, availability_block + insert_anchor, "roadmap availability section")
          roadmap_path.write_text(roadmap)

      - name: Commit reconciled docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md ROADMAP_MASTER_CHECKLIST.md
          git diff --cached --check
          git commit -m "docs: reconcile P3.3 closeout and P3.4 gate"
          git push origin HEAD:docs/p3-3-closeout-roadmap
