name: Apply Rental PA pair editor fix

on:
  push:
    branches:
      - fix-rental-pa-pair-editor
    paths:
      - scripts/apply-rental-pa-pair-editor-fix.mjs
      - .github/workflows/apply-rental-pa-pair-editor-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-rental-pa-pair-editor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded patch
        run: node scripts/apply-rental-pa-pair-editor-fix.mjs
      - name: Validate syntax and whitespace
        run: |
          node --check admin/editor/rental-stabilization-editor.js
          node --check admin/admin-stabilization.js
          git diff --check
      - name: Commit patched runtime
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/editor/rental-stabilization-editor.js admin/admin-stabilization.js
          git commit -m "Keep Rental PA pair media synchronized"
          git push origin HEAD:fix-rental-pa-pair-editor
