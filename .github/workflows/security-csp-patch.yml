name: Temporary security CSP patch

on:
  push:
    branches:
      - security/baseline-csp

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/baseline-csp
          fetch-depth: 0
      - name: Patch Worker entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker-entry.js')
          text = p.read_text()
          old = 'import apiWorker from "./worker.js";\n'
          new = 'import apiWorker from "./worker.js";\nimport { applyBaselineSecurityHeaders } from "./security-headers.js";\n'
          if old not in text:
              raise SystemExit('worker-entry import anchor missing')
          text = text.replace(old, new, 1)
          old = '  const headers = new Headers(transformed.headers);\n\n  // The root HTML contains live CMS data'
          new = '  const headers = new Headers(transformed.headers);\n  applyBaselineSecurityHeaders(headers);\n\n  // The root HTML contains live CMS data'
          if old not in text:
              raise SystemExit('worker-entry headers anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)
          Path('.github/workflows/security-csp-patch.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-entry.js .github/workflows/security-csp-patch.yml
          git commit -m "security: apply baseline headers to SSR Home"
          git push origin HEAD:security/baseline-csp
