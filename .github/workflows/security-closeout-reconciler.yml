              ("| Runtime production baseline verificado | `3501169a1f5131a0adae1bf13b955d6aa78dbb28` — P3.4b responsive R2/CMS media delivery, production-smoked |", "| Runtime production baseline verificado | `2c0fe574a0ab37ceb00cf84b31cbf1b68e1746c4` — Security B public-form rate limiting, production-smoked |", "status runtime baseline"),
              ("| Trabajo activo | **Security baseline — rate limiting + baseline CSP** |", "| Trabajo activo | **Control Center Step 3 — full finance-app audit / repair-vs-rewrite decision** |", "status active work"),
              ("| Milestone actual | Control Center prerequisites — hardening before operational/financial-adjacent integrations |", "| Milestone actual | SD.Live as Control Center — finance-system evidence/audit before integration |", "status milestone"),
              ("| Estado | **P3.0–P3.4 CERRADOS; Security baseline promovido a F** |", "| Estado | **P3.0–P3.4 CERRADOS; Security baseline CERRADO; Finance audit promovido a F** |", "status state"),
              ("| Active Gate | **F — Security baseline: rate limiting + baseline CSP** |", "| Active Gate | **F — Full audit of finance app / explicit repair-vs-rewrite decision** |", "status active gate"),
              ("| Gate posterior | **Full audit of finance app / repair-vs-rewrite decision; Availability/WhatsApp may run in parallel only after this gate closes** |", "| Gate posterior | **Brand-coherent rename → field/source mapping → read-only Admin insights; Availability/WhatsApp is eligible as the explicit parallel track** |", "status next gate"),
              ("| Availability-Aware Contact Widget | Propuesto; no runtime/schema | D — Medium-High backlog after active gate |", "| Availability-Aware Contact Widget | Propuesto; no runtime/schema | D — eligible parallel track after Security closeout; not active automatically |", "evidence availability"),
              ("| SD.Live as Control Center | Reprioritized direction; not yet implemented | D direction / sequenced after security gate | `docs/roadmap/sdlive-control-center.md`; security → finance audit → rename → source mapping → read-only Admin insights; Availability is the explicit parallel-track exception |", "| SD.Live as Control Center | Steps 1–2 prerequisites closed; Step 3 finance audit active | **F — Step 3 Active Gate** | `docs/roadmap/sdlive-control-center.md`; P3.4 + Security closed → finance audit → rename → source mapping → read-only Admin insights; Availability is the explicit parallel-track exception |", "evidence control center"),
              ("- [ ] **F — P3.4 Responsive image/media delivery pipeline:** variantes y `srcset`/`sizes` para R2/media + optimización separada de header/static assets; preservar master/original y no resolver asset-by-asset.", "- [x] **P3.4 Responsive image/media delivery pipeline:** cerrado 2026-08-22; PR #50/#51, Cloudflare Transformations zone-only, final Mobile 90 / LCP 3.1 s y ahorro estimado de image delivery ~1.423 MiB → ~58 KiB.", "platform P3.4"),
              ("- [ ] Rate limiting explícito y verificable.", "- [x] **Rate limiting explícito/verificable:** PR #54 / `2c0fe574...`; `POST /api/contact` y `POST /api/rental` usan bindings independientes 10/60s antes de Turnstile/D1/Resend; normal submissions smokeados en producción.", "platform rate limit"),
              ("- [ ] CSP, Referrer-Policy y Permissions-Policy sin romper GTM/Turnstile/media.", "- [x] **CSP + browser headers baseline:** PR #53 / `2710c0c0...`; shared CSP para Static Assets + SSR Home, sin `unsafe-eval`, con GTM/GA/Fonts/Turnstile/Insights/R2 permitidos; Home/EN/Admin/Editor preview smokeados.", "platform CSP"),
              ("- **F — Active Gate:** **P3.4 Responsive image/media delivery pipeline.** Reducir bytes/imágenes responsive sin degradar masters, CMS/R2 ownership, layout ni branding.", "- **F — Active Gate:** **Control Center Step 3 — full finance-app audit / repair-vs-rewrite decision.** No integrar, reparar ni reescribir hasta auditar datos, fórmulas, AppSheet sync/actions/bots y ownership/migration implications.", "future evolution active gate"),
              ("| Responsive image delivery | ~1.4 MB estimated savings repetido | variants/`srcset`/`sizes` pipeline; preservar masters | **F — P3.4** | P1-HIGH | M/L | alto | medio | PageSpeed audit + R2/static asset architecture |", "| Responsive image delivery | cerrado y production-smoked | conservar pipeline responsive y masters; payload timing queda separado | **A — P3.4 closed** | closed | — | alto | bajo | PR #50/#51 + Mobile 90/LCP 3.1 s + ~58 KiB residual |\n| Finance app / Control Center Step 3 | sistema externo actual aún no auditado de punta a punta | auditar datos, fórmulas, AppSheet sync/actions/bots y decidir repair vs rewrite por evidencia | **F — Active Gate** | P0 prerequisite | M/L audit | muy alto | alto | `docs/roadmap/sdlive-control-center.md`; no architecture decision before audit |", "gap responsive + finance"),
              ("| Availability-aware contact | no existe runtime/schema todavía | D1 availability state + owner commands + WhatsApp/AI surface switching | **D — Medium-High after active gate** | next backlog | L | alto conversión | alto | exact owner auth + existing `leads` + provider/webhook validation |", "| Availability-aware contact | no existe runtime/schema todavía | D1 availability state + owner commands + WhatsApp/AI surface switching | **D — parallel-track eligible, not auto-active** | parallel option | L | alto conversión | alto | Security prerequisite closed; exact owner auth + existing `leads` + provider/webhook validation |", "gap availability"),
              ("9. **Responsive image/media delivery.** P3.4 es el gate activo tras cerrar P3.3; variants/`srcset`/`sizes` deben preservar masters y ownership.\n10. **Availability-Aware Contact Widget.** Medium-High inmediatamente después del active gate salvo repriorización explícita; D1 availability source-of-truth, owner WhatsApp hard gate y existing `leads` table.", "9. **Finance-app audit / repair-vs-rewrite.** Active Control Center Step 3: auditar el sistema completo antes de decidir arquitectura, migración o integración.\n10. **Responsive image/media delivery.** P3.4 está cerrado; conservar variants/`srcset`/`sizes`, masters y ownership sin reabrir el gate por optimizaciones de payload timing.\n11. **Availability-Aware Contact Widget.** Security ya cerró, por lo que este track es elegible en paralelo; sigue D hasta promoción explícita. D1 availability source-of-truth, owner WhatsApp hard gate y existing `leads` table.", "P1 priorities"),
              ("**BACKLOG D / Medium-High.** Se preservó `docs/roadmap/availability-aware-contact-widget.md`. Debe ir después del active gate y por encima del backlog general CRM/Calendar/quote automation salvo repriorización. No existe todavía D1 schema/API/webhook/widget; no tratar como implementado.", "**BACKLOG D / parallel-track eligible.** Se preservó `docs/roadmap/availability-aware-contact-widget.md`. P3.4 y Security ya cerraron, así que puede promocionarse como track paralelo al finance audit si se aprueba explícitamente; no existe todavía D1 schema/API/webhook/widget y no debe tratarse como implementado.", "availability milestone"),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)

          milestone_marker = "## 2026-08-22 — Availability-Aware Contact roadmap checkpoint\n"
          inserted = """## 2026-08-22 — P3.4 Responsive image/media delivery

**CERRADO.** PR #50 introdujo variantes responsive del header manteniendo masters/static Admin; PR #51 extendió `srcset` a Trusted client logos y About desde R2. Production smoke confirmó header, Trusted y About visualmente normales sin popping. PageSpeed Mobile final: Performance 90, LCP 3.1 s y `Improve image delivery` ~58 KiB residual frente a ~1.423 MiB inicial.

## 2026-08-22 — Security baseline

**CERRADO y VALIDADO EN PRODUCCIÓN.** PR #53 (`2710c0c0...`) añadió CSP/browser headers compartidos sin romper Home, `/en/`, Cloudflare Access ni el preview same-origin del Site Editor. PR #54 (`2c0fe574...`) añadió rate limiting Worker-native independiente para Contact y Rental, 10 requests/60s por endpoint antes de Turnstile/D1/Resend. Contact y Rental normal submissions fueron enviados en producción y sus emails llegaron correctamente; Rental continuó notificando únicamente a `rental@sdlive.show`.

"""
          if inserted not in text:
              if milestone_marker not in text:
                  raise SystemExit("missing project milestone insertion point")
              text = text.replace(milestone_marker, inserted + milestone_marker, 1)

          next_marker = "# Siguiente trabajo\n"
          if next_marker not in text:
              raise SystemExit("missing project next-work marker")
          text = text.split(next_marker, 1)[0] + """# Siguiente trabajo

**F — Control Center Step 3: auditoría completa del sistema financiero actual (NextPay26) y decisión explícita repair vs rewrite.**

Orden del gate:

1. inventariar el sistema real actual: Google Sheets, AppSheet, tablas/slices/views/actions/bots, archivos/documentación y cualquier automatización externa relevante;
2. auditar calidad de datos sin limitarse a problemas ya conocidos: duplicados/ghost rows, tipos, llaves, fechas, monedas, estados y consistencia histórica;
3. revisar fórmulas y reglas de negocio: COP/USD, fees, retenciones, facturación/cuenta de cobro, aging, fechas/estado de pago y campos derivados;
4. revisar confiabilidad de sync AppSheet↔Sheet, acciones y bots/recordatorios, incluyendo qué ocurre offline/retry/conflict cuando aplique;
5. mapear modelo y ownership actual de jobs/events, clientes, pagos, invoice lifecycle y relaciones;
6. documentar riesgos de continuar reparando versus reescribir, incluyendo costo de migración, rollback, operación y source-of-truth;
7. emitir una decisión escrita **repair vs full rewrite** con evidencia. Si rewrite gana, diseñar target architecture/migration/rollback antes de código; si repair gana, definir el repair plan y qué sigue siendo authoritative;
8. **no** renombrar, integrar con `/admin`, mover a D1 ni crear sync bidireccional antes de cerrar esta decisión;
9. después de la decisión: brand-coherent rename → field/source-of-truth mapping → read-only Admin insights;
10. Availability/WhatsApp puede correr en paralelo solo si se promueve explícitamente; Security ya no lo bloquea.

Mantener además el recheck de Bing para **2026-08-28 a 2026-09-04** sin re-submissions repetidos mientras tanto.

**Sound for Picture permanece inert staging en static/Admin source hasta contenido/scope real aprobado; no forma parte del response público Home desde P3.2.**
"""
          path.write_text(text)

          # ROADMAP_MASTER_CHECKLIST
          path = Path("ROADMAP_MASTER_CHECKLIST.md")
          text = path.read_text()
