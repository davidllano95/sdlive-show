name: Temporary Step 5 PR docs reconciler

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'docs/step5-source-map-closeout'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: docs/step5-source-map-closeout
          fetch-depth: 0

      - name: Execute embedded reconciler
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path

          source = Path('.github/workflows/docs-step5-reconcile.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          exec(compile(script, 'step5-docs-reconciler', 'exec'))
          PY2

          git rm .github/workflows/docs-step5-reconcile.yml
          git rm .github/workflows/docs-step5-pr-reconcile.yml
          git rm docs/.step5-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATUS.md ROADMAP_MASTER_CHECKLIST.md docs/roadmap/sdlive-control-center.md docs/checkpoints/sdlive-track-source-of-truth-2026-08-22.md
          git commit -m "Docs: close finance source mapping and activate read-only insights"
          git push origin HEAD:docs/step5-source-map-closeout
