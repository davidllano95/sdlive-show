name: Security closeout PR reconciler

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'docs/security-closeout-finance-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/security-closeout-finance-audit
          fetch-depth: 0

      - name: Run embedded reconciler
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/security-closeout-reconciler.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          Path('/tmp/security_closeout_reconcile.py').write_text(code)
          PY
          python /tmp/security_closeout_reconcile.py
          python - <<'PY'
          from pathlib import Path
          path = Path('ROADMAP_MASTER_CHECKLIST.md')
          text = path.read_text()
          text = text.replace('Last reconciliation: **2026-08-22 — America/Bogota**  \n', 'Last reconciliation: **2026-08-22 — America/Bogota**\n', 1)
          path.write_text(text)
          PY
          git diff --check
          rm .github/workflows/security-closeout-reconciler.yml .github/workflows/security-closeout-pr-reconciler.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATUS.md ROADMAP_MASTER_CHECKLIST.md docs/roadmap/sdlive-control-center.md .github/workflows/security-closeout-reconciler.yml .github/workflows/security-closeout-pr-reconciler.yml
          git commit -m "docs: close security and activate finance audit [skip ci]"
          git push origin HEAD:docs/security-closeout-finance-audit