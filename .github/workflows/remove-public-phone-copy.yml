name: Remove remaining public phone copy

on:
  push:
    branches:
      - privacy-whatsapp-username
    paths:
      - .github/workflows/remove-public-phone-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: privacy-whatsapp-username
          fetch-depth: 0

      - name: Remove visible phone copy and strengthen regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          privacy = Path('privacy.html')
          text = privacy.read_text(encoding='utf-8')
          text = text.replace('            <p><strong>Teléfono:</strong> <a href="#contact">+57 319 247 3948</a></p>\n', '')
          text = text.replace('            <p><strong>Phone:</strong> <a href="#contact">+57 319 247 3948</a></p>\n', '')
          privacy.write_text(text, encoding='utf-8')

          test = Path('tests/whatsapp-username-privacy.test.mjs')
          source = test.read_text(encoding='utf-8')
          old = "      assert.doesNotMatch(html, /\\\"telephone\\\"\\s*:\\s*\\\"\\+?\\d{7,}\\\"/, `${path} contains public telephone structured data`);\n"
          new = old + "      assert.doesNotMatch(html, /573192473948|319\\s*247\\s*3948/, `${path} contains the owner phone number as public copy`);\n"
          if old not in source:
              raise SystemExit('Expected privacy assertion not found')
          test.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate privacy invariant
        run: |
          node --test tests/whatsapp-username-privacy.test.mjs
          git diff --check

      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-public-phone-copy.yml
          git add privacy.html tests/whatsapp-username-privacy.test.mjs
          git commit -m 'Remove remaining public phone copy'
          git push origin HEAD:privacy-whatsapp-username
