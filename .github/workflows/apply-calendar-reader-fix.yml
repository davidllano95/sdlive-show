name: Apply Calendar reader fix

on:
  push:
    branches:
      - fix-calendar-canonical-registro-reader

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-calendar-canonical-registro-reader
          fetch-depth: 0

      - name: Apply canonical reader patch
        run: node scripts/apply-calendar-canonical-reader-fix.mjs

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-schedule-google-projection.js tests/site-schedule-canonical-reader.test.mjs
          git commit -m "Use canonical Calendar parser in Site Schedule sync"
          git push origin HEAD:fix-calendar-canonical-registro-reader
