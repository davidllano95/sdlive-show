name: Apply Site Schedule V2 sync fix

on:
  push:
    branches:
      - fix-google-sync-site-schedule-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-google-sync-site-schedule-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          projection = Path('site-schedule-google-projection.js')
          text = projection.read_text()
          old = 'import { calendarEventKey, readSiteSchedule } from "./site-schedule-api.js";'
          new = 'import { calendarEventKey } from "./site-schedule-api.js";\nimport { readSiteScheduleV2 } from "./site-schedule-store-v2.js";'
          if old not in text:
              raise SystemExit('Expected V1 Site Schedule import not found')
          text = text.replace(old, new, 1)
          if '    readSiteSchedule(env),' not in text:
              raise SystemExit('Expected V1 Site Schedule read not found')
          text = text.replace('    readSiteSchedule(env),', '    readSiteScheduleV2(env),', 1)
          projection.write_text(text)

          fake = '''function fakeScheduleDb(schedule) {
            return {
              prepare(sql) {
                return {
                  bind() {
                    return this;
                  },
                  async run() {
                    return { success: true };
                  },
                  async first() {
                    if (!String(sql).includes("site_schedule_state")) return null;
                    return {
                      content_json: JSON.stringify(schedule),
                      updated_at: "2026-08-31T19:00:00Z"
                    };
                  }
                };
              }
            };
          }'''

          for filename in [
              'tests/site-schedule-google-projection.test.mjs',
              'tests/site-schedule-legacy-source-match.test.mjs'
          ]:
              path = Path(filename)
              source = path.read_text()
              if filename.endswith('site-schedule-google-projection.test.mjs'):
                  pattern = r'function fakeScheduleDb\(schedule\) \{.*?\n\}\n\nfunction jsonResponse'
                  replacement = fake + '\n\nfunction jsonResponse'
              else:
                  pattern = r'function fakeScheduleDb\(schedule\) \{.*?\n\}\n\ntest\('
                  replacement = fake + '\n\ntest('
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not update fakeScheduleDb in {filename}')
              path.write_text(updated)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-schedule-google-projection.js tests/site-schedule-google-projection.test.mjs tests/site-schedule-legacy-source-match.test.mjs
          git diff --cached --quiet || git commit -m "Use Site Schedule V2 store for Google sync"
          git push
