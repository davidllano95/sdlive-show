<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000"><meta name="robots" content="noindex"><link rel="icon" href="/assets/icons/favicon.ico">
<link rel="stylesheet" href="/styles.css?v=20260819-1"><title>Production — SD•Live Work</title>
<style>
body{background:#000;color:var(--color-text)}.detail-wrap{max-width:var(--max-width);padding:30px 26px 110px;margin:auto}.detail-bar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:25px;border-bottom:1px solid var(--color-border)}
.detail-bar a{color:var(--color-text-soft);font:600 13px var(--font-body)}.detail-bar a:hover{color:var(--color-accent)}.detail-bar__logo{font:700 24px var(--font-display);color:var(--color-text)!important}
.detail-main{display:grid;grid-template-columns:minmax(230px,390px) 1fr;gap:clamp(30px,7vw,115px);padding-top:80px;align-items:start}
.detail-poster{aspect-ratio:2/3;border:1px solid var(--color-border);background:#0c0c0c;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;position:relative;text-align:center}
.detail-poster img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.detail-poster span{font:600 clamp(28px,4vw,48px)/1.12 var(--font-display);letter-spacing:-.06em}
.detail-kicker{font:600 11px var(--font-mono);letter-spacing:.15em;text-transform:uppercase;color:var(--color-accent)}
.detail-copy h1{font:600 clamp(43px,6vw,82px)/1.04 var(--font-display);letter-spacing:-.065em;margin:16px 0 25px}.detail-credit{font:600 clamp(17px,2vw,24px)/1.4 var(--font-body);margin-bottom:35px}
.detail-facts{display:grid;grid-template-columns:140px 1fr;gap:14px 18px;padding:25px 0;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);font:500 14px/1.55 var(--font-body)}
.detail-facts dt{color:var(--color-muted)}.detail-facts dd{margin:0}.detail-note{color:var(--color-text-soft);font:400 14px/1.8 var(--font-body);margin-top:30px;max-width:570px}
.detail-media{border-top:1px solid var(--color-border);margin-top:90px;padding-top:35px}.detail-media h2{font:600 26px var(--font-display)}.detail-media p{color:var(--color-muted);margin-top:14px;max-width:690px}
.detail-lang button{font:600 12px var(--font-mono);padding:10px;color:var(--color-text-soft)}.detail-lang button[aria-pressed=true]{color:var(--color-accent)}
@media(max-width:700px){.detail-wrap{padding:22px 20px 75px}.detail-main{grid-template-columns:1fr;padding-top:40px}.detail-poster{max-width:390px;width:100%}.detail-facts{grid-template-columns:110px 1fr}.detail-media{margin-top:50px}}
</style></head><body><div class="detail-wrap"><header class="detail-bar"><a href="/work/" id="back">← All Work</a><a href="/" class="detail-bar__logo" aria-label="SD.Live home">SD<span class="brand-wordmark-text__dot" aria-hidden="true"></span>Live</a><div class="detail-lang"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="es" aria-pressed="false">ES</button></div></header>
<main id="detailMain" class="detail-main" hidden><div class="detail-poster"><span id="posterTitle"></span></div><div class="detail-copy"><div class="detail-kicker" id="kicker">Production / Work</div><h1 id="showTitle"></h1><p class="detail-credit" id="credit"></p><dl class="detail-facts"><dt id="companyLabel">Company</dt><dd id="company"></dd><dt id="roleLabel">Role</dt><dd id="role"></dd><dt id="typeLabel">Work</dt><dd id="type"></dd><dt id="clientLabel" hidden>Production</dt><dd id="client" hidden></dd><dt id="extraLabel" hidden>Additional services</dt><dd id="extra" hidden></dd></dl><p class="detail-note" id="note"></p></div></main>
<section class="detail-media" id="mediaSection" hidden><h2 id="mediaHeading">Production material</h2><p id="mediaNote"></p></section><div id="notFound" hidden><h1>Production not found</h1><a href="/work/">← Work</a></div></div>
<script src="/work/data.js"></script><script>
(()=>{const slug=new URLSearchParams(location.search).get("show"),show=(window.SDL_WORK||[]).find(x=>x.slug===slug),$=id=>document.getElementById(id);if(!show){$("notFound").hidden=false;return;}
const put=(id,s)=>$(id).textContent=s;
document.title=show.title+" — SD•Live Work";$("detailMain").hidden=false;$("mediaSection").hidden=false;put("posterTitle",show.title);put("showTitle",show.title);put("credit",show.credit);put("company",show.company);put("role",show.credit);put("client",show.client||"");$("client").hidden=!show.client;$("clientLabel").hidden=!show.client;
$("extra").hidden=!show.extra;$("extraLabel").hidden=!show.extra;
let lang="en";try{lang=localStorage.getItem("sdlive-language-preference")==="es"?"es":"en"}catch{}
function translate(l){lang=l;document.documentElement.lang=l;$("back").textContent=l==="es"?"← Todos los trabajos":"← All Work";put("kicker",l==="es"?"Producción / Portafolio":"Production / Work");put("companyLabel",l==="es"?"Empresa":"Company");put("roleLabel",l==="es"?"Crédito":"Credit");put("typeLabel",l==="es"?"Trabajo":"Work");put("clientLabel",l==="es"?"Producción":"Production");put("extraLabel",l==="es"?"Servicios adicionales":"Additional services");put("type",show.discipline);put("extra",l==="es"?(show.extraEs||show.extra||""):(show.extra||""));put("mediaHeading",l==="es"?"Material de producción":"Production material");put("note",l==="es"?"Esta es la ficha inicial. La descripción y los materiales se incorporarán después de verificar los créditos y permisos de publicación.":"This is the initial production profile. Narrative and media will be added once credits and publishing permissions are verified.");put("mediaNote",l==="es"?"Próximamente: póster oficial, imágenes, video o audio según el material autorizado y disponible.":"Coming next: official poster, photos, video or audio, depending on the available approved material.");document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===l)));try{localStorage.setItem("sdlive-language-preference",l)}catch{}}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>translate(b.dataset.lang)));translate(lang);
})();
</script></body></html>
